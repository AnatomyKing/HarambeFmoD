name: Discord model previews

on:
  push:
    branches:
      - '**'   # run on any branch

jobs:
  send-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # System deps needed for the `canvas` npm package
      - name: Install native deps for node-canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Install Node dependencies
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install sharp canvas

      - name: Render changed models and send collage to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const sharp = require('sharp');
          const { createCanvas, loadImage } = require('canvas');

          const webhook = process.env.DISCORD_WEBHOOK;
          if (!webhook) {
            console.error('DISCORD_WEBHOOK secret is not set');
            process.exit(0);
          }

          // GitHub event payload
          const payloadPath = process.env.GITHUB_EVENT_PATH;
          const payload = JSON.parse(fs.readFileSync(payloadPath, 'utf8'));
          const repoFull = payload.repository.full_name;
          const headSha = payload.after || (payload.head_commit && payload.head_commit.id);
          const baseSha = payload.before;

          console.log('Repo:', repoFull);
          console.log('Base SHA (before):', baseSha);
          console.log('Head SHA (after):', headSha);

          if (!baseSha || !headSha || baseSha === headSha) {
            console.log('No base/head to compare (maybe force-push or initial commit), skipping.');
            process.exit(0);
          }

          const [owner, repo] = repoFull.split('/');

          function ghRequest(pathname) {
            const token = process.env.GITHUB_TOKEN;
            const options = {
              hostname: 'api.github.com',
              path: pathname,
              method: 'GET',
              headers: {
                'User-Agent': 'github-actions',
                'Accept': 'application/vnd.github+json',
              },
            };
            if (token) {
              options.headers.Authorization = `Bearer ${token}`;
            }
            return new Promise((resolve, reject) => {
              https
                .get(options, (res) => {
                  let data = '';
                  res.on('data', (chunk) => (data += chunk));
                  res.on('end', () => {
                    if (res.statusCode >= 200 && res.statusCode < 300) {
                      try {
                        resolve(JSON.parse(data));
                      } catch (e) {
                        reject(new Error(`Failed to parse GitHub API JSON: ${e.message}`));
                      }
                    } else {
                      reject(new Error(`GitHub API ${res.statusCode}: ${data}`));
                    }
                  });
                })
                .on('error', reject);
            });
          }

          // Resolve a texture reference like "harambefmod:item/anyphone"
          function resolveTexturePath(ref) {
            if (!ref || typeof ref !== 'string') return null;
            if (ref.startsWith('builtin/')) return null;

            let namespace = 'minecraft';
            let pathKey = ref;

            const parts = ref.split(':');
            if (parts.length === 2) {
              namespace = parts[0];
              pathKey = parts[1];
            }

            const texPath = pathKey.replace(/\//g, path.sep) + '.png';

            return path.join(
              'src',
              'main',
              'resources',
              'assets',
              namespace,
              'textures',
              texPath
            );
          }

          async function loadTextures(modelPath, model) {
            const texturesDef = model.textures || {};
            const entries = Object.entries(texturesDef);
            const result = {};
            for (const [key, ref] of entries) {
              const texPath = resolveTexturePath(ref);
              if (!texPath) continue;
              const abs = path.join(process.cwd(), texPath);
              if (!fs.existsSync(abs)) {
                console.warn('Texture file not found:', abs);
                continue;
              }
              try {
                const img = await loadImage(abs);
                result[key] = img;
              } catch (err) {
                console.error('Failed to load texture', abs, err);
              }
            }
            return result;
          }

          function degToRad(d) {
            return (d * Math.PI) / 180;
          }

          function rotateAroundAxis(v, axis, angleDeg, origin) {
            if (!angleDeg) return { ...v };
            const angle = degToRad(angleDeg);
            const sin = Math.sin(angle);
            const cos = Math.cos(angle);
            const ox = origin[0];
            const oy = origin[1];
            const oz = origin[2];
            let x = v.x - ox;
            let y = v.y - oy;
            let z = v.z - oz;
            let nx = x;
            let ny = y;
            let nz = z;
            switch (axis) {
              case 'x':
                ny = y * cos - z * sin;
                nz = y * sin + z * cos;
                break;
              case 'y':
                nx = x * cos + z * sin;
                nz = -x * sin + z * cos;
                break;
              case 'z':
                nx = x * cos - y * sin;
                ny = x * sin + y * cos;
                break;
            }
            return { x: nx + ox, y: ny + oy, z: nz + oz };
          }

          // Apply display.gui transform
          function applyDisplayTransform(v, display) {
            const gui = (display && display.gui) || {};
            const rot = gui.rotation || [0, 0, 0];
            const trans = gui.translation || [0, 0, 0];
            const scale = gui.scale || [1, 1, 1];

            let x = v.x + trans[0];
            let y = v.y + trans[1];
            let z = v.z + trans[2];

            // scale around origin
            x *= scale[0];
            y *= scale[1];
            z *= scale[2];

            // apply rotations X -> Y -> Z (Minecraft-ish)
            let vec = { x, y, z };
            vec = rotateAroundAxis(vec, 'x', rot[0], [0, 0, 0]);
            vec = rotateAroundAxis(vec, 'y', rot[1], [0, 0, 0]);
            vec = rotateAroundAxis(vec, 'z', rot[2], [0, 0, 0]);
            return vec;
          }

          // Project 3D to 2D (orthographic, Y up)
          function project2D(v) {
            return { x: v.x, y: v.y, z: v.z };
          }

          function buildFaces(model, textures) {
            const elements = model.elements || [];
            const faces = [];

            for (const el of elements) {
              const from = el.from || [0, 0, 0];
              const to = el.to || [0, 0, 0];
              const rot = el.rotation || null;
              const facesDef = el.faces || {};

              const x0 = Math.min(from[0], to[0]);
              const x1 = Math.max(from[0], to[0]);
              const y0 = Math.min(from[1], to[1]);
              const y1 = Math.max(from[1], to[1]);
              const z0 = Math.min(from[2], to[2]);
              const z1 = Math.max(from[2], to[2]);

              const baseVerts = {
                north: [
                  { x: x0, y: y0, z: z0 },
                  { x: x1, y: y0, z: z0 },
                  { x: x1, y: y1, z: z0 },
                  { x: x0, y: y1, z: z0 },
                ],
                south: [
                  { x: x1, y: y0, z: z1 },
                  { x: x0, y: y0, z: z1 },
                  { x: x0, y: y1, z: z1 },
                  { x: x1, y: y1, z: z1 },
                ],
                west: [
                  { x: x0, y: y0, z: z1 },
                  { x: x0, y: y0, z: z0 },
                  { x: x0, y: y1, z: z0 },
                  { x: x0, y: y1, z: z1 },
                ],
                east: [
                  { x: x1, y: y0, z: z0 },
                  { x: x1, y: y0, z: z1 },
                  { x: x1, y: y1, z: z1 },
                  { x: x1, y: y1, z: z0 },
                ],
                up: [
                  { x: x0, y: y1, z: z0 },
                  { x: x1, y: y1, z: z0 },
                  { x: x1, y: y1, z: z1 },
                  { x: x0, y: y1, z: z1 },
                ],
                down: [
                  { x: x0, y: y0, z: z1 },
                  { x: x1, y: y0, z: z1 },
                  { x: x1, y: y0, z: z0 },
                  { x: x0, y: y0, z: z0 },
                ],
              };

              for (const dir of Object.keys(facesDef)) {
                const faceInfo = facesDef[dir];
                let verts = baseVerts[dir];
                if (!verts) continue;

                // element rotation
                if (rot && rot.angle) {
                  verts = verts.map((v) =>
                    rotateAroundAxis(v, rot.axis || 'y', rot.angle, rot.origin || [8, 8, 8])
                  );
                }

                // display transform (GUI)
                verts = verts.map((v) => applyDisplayTransform(v, model.display));

                const uv = faceInfo.uv || [0, 0, 16, 16];
                let texKey = null;
                if (typeof faceInfo.texture === 'string' && faceInfo.texture.startsWith('#')) {
                  texKey = faceInfo.texture.slice(1);
                }
                const texImg = (texKey && textures[texKey]) || textures['layer0'] || null;
                if (!texImg) continue;

                const projVerts = verts.map(project2D);
                const depth =
                  projVerts.reduce((acc, v) => acc + v.z, 0) / projVerts.length;

                faces.push({
                  dir,
                  uv,
                  texture: texImg,
                  verts3D: projVerts,
                  depth,
                });
              }
            }

            return faces;
          }

          function projectFacesToScreen(faces, width, height) {
            let minX = Infinity;
            let maxX = -Infinity;
            let minY = Infinity;
            let maxY = -Infinity;

            for (const face of faces) {
              for (const v of face.verts3D) {
                const x = v.x;
                const y = v.y;
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }

            if (!isFinite(minX) || !isFinite(maxX) || !isFinite(minY) || !isFinite(maxY)) {
              return;
            }

            const spanX = maxX - minX || 1;
            const spanY = maxY - minY || 1;
            const scale = 0.8 * Math.min(width / spanX, height / spanY);

            const offsetX = width / 2 - ((minX + maxX) / 2) * scale;
            const offsetY = height / 2 + ((minY + maxY) / 2) * scale;

            for (const face of faces) {
              face.verts2D = face.verts3D.map((v) => ({
                x: v.x * scale + offsetX,
                y: -v.y * scale + offsetY,
              }));
            }
          }

          function drawFace(ctx, face) {
            const verts = face.verts2D;
            if (!verts || verts.length !== 4) return;

            const img = face.texture;
            const uv = face.uv;
            const u0 = uv[0];
            const v0 = uv[1];
            const u1 = uv[2];
            const v1 = uv[3];

            const sw = Math.max(1, u1 - u0);
            const sh = Math.max(1, v1 - v0);

            const p0 = verts[0];
            const p1 = verts[1];
            const p3 = verts[3];

            const vx = { x: p1.x - p0.x, y: p1.y - p0.y };
            const vy = { x: p3.x - p0.x, y: p3.y - p0.y };

            ctx.save();

            const a = vx.x / sw;
            const b = vx.y / sw;
            const c = vy.x / sh;
            const d = vy.y / sh;
            const e = p0.x;
            const f = p0.y;

            ctx.setTransform(a, b, c, d, e, f);

            ctx.drawImage(
              img,
              u0,
              v0,
              sw,
              sh,
              0,
              0,
              sw,
              sh
            );

            ctx.restore();
          }

          async function renderModelFile(modelPath, outPath) {
            let model;
            try {
              const raw = fs.readFileSync(modelPath, 'utf8');
              model = JSON.parse(raw);
            } catch (err) {
              console.error('Failed to read/parse model', modelPath, err);
              return false;
            }

            const textures = await loadTextures(modelPath, model);
            if (!Object.keys(textures).length) {
              console.warn('No textures loaded for model', modelPath);
              return false;
            }

            const faces = buildFaces(model, textures);
            if (!faces.length) {
              console.warn('No faces to render for model', modelPath);
              return false;
            }

            const width = 512;
            const height = 512;
            const canvas = createCanvas(width, height);
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, width, height);
            ctx.imageSmoothingEnabled = false;

            projectFacesToScreen(faces, width, height);

            faces.sort((a, b) => a.depth - b.depth);

            for (const face of faces) {
              drawFace(ctx, face);
            }

            fs.writeFileSync(outPath, canvas.toBuffer('image/png'));
            return true;
          }

          async function sendCollageToDiscord(imagePaths) {
            if (!imagePaths.length) {
              console.log('No images to send to Discord.');
              return;
            }

            const buffers = imagePaths.map((p) => fs.readFileSync(p));
            const metas = await Promise.all(buffers.map((b) => sharp(b).metadata()));
            const heights = metas.map((m) => m.height || 0);
            const maxHeight = Math.max(...heights);

            const resizedBuffers = await Promise.all(
              buffers.map((b) => sharp(b).resize({ height: maxHeight }).toBuffer())
            );
            const resizedMetas = await Promise.all(
              resizedBuffers.map((b) => sharp(b).metadata())
            );
            const widths = resizedMetas.map((m) => m.width || 0);

            let x = 0;
            const composites = [];
            for (let i = 0; i < resizedBuffers.length; i++) {
              composites.push({
                input: resizedBuffers[i],
                left: x,
                top: 0,
              });
              x += widths[i];
            }

            let collageBuffer = await sharp({
              create: {
                width: x,
                height: maxHeight,
                channels: 4,
                background: { r: 0, g: 0, b: 0, alpha: 0 },
              },
            })
              .composite(composites)
              .png()
              .toBuffer();

            const SCALE = 4;
            collageBuffer = await sharp(collageBuffer)
              .resize({
                width: Math.round(x * SCALE),
                height: Math.round(maxHeight * SCALE),
                kernel: sharp.kernel.nearest,
              })
              .png()
              .toBuffer();

            const payloadJson = JSON.stringify({
              embeds: [
                {
                  image: { url: 'attachment://collage.png' },
                },
              ],
            });

            const boundary = '----WebKitFormBoundary7MA4YWxkTrZu0gW';
            const preamble =
              `--${boundary}\r\n` +
              `Content-Disposition: form-data; name="payload_json"\r\n` +
              `Content-Type: application/json\r\n\r\n` +
              payloadJson +
              `\r\n` +
              `--${boundary}\r\n` +
              `Content-Disposition: form-data; name="file"; filename="collage.png"\r\n` +
              `Content-Type: image/png\r\n\r\n`;
            const closing = `\r\n--${boundary}--\r\n`;

            const options = new URL(webhook);
            options.method = 'POST';
            options.headers = {
              'Content-Type': 'multipart/form-data; boundary=' + boundary,
            };

            await new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                let respData = '';
                res.on('data', (chunk) => (respData += chunk));
                res.on('end', () => {
                  console.log('Discord response:', res.statusCode, respData);
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error('Discord returned non-2xx status'));
                  } else {
                    resolve();
                  }
                });
              });
              req.on('error', (err) => {
                console.error('Error sending to Discord:', err);
                reject(err);
              });
              req.write(preamble);
              req.write(collageBuffer);
              req.write(closing);
              req.end();
            });
          }

          (async () => {
            try {
              const comparePath = `/repos/${owner}/${repo}/compare/${baseSha}...${headSha}`;
              console.log('Calling GitHub compare API:', comparePath);
              const compare = await ghRequest(comparePath);
              const files = compare.files || [];
              console.log('Compare returned', files.length, 'file(s)');

              const modelFiles = files.filter(
                (f) =>
                  typeof f.filename === 'string' &&
                  f.filename.toLowerCase().endsWith('.json') &&
                  f.filename.includes('src/main/resources/assets/') &&
                  f.filename.includes('/models/')
              );

              if (!modelFiles.length) {
                console.log('No model JSON files changed in this push, skipping Discord call.');
                process.exit(0);
              }

              console.log(
                'Model JSON files:',
                modelFiles.map((f) => f.filename).join(', ')
              );

              fs.mkdirSync('renders', { recursive: true });

              const renderedPaths = [];
              for (const f of modelFiles) {
                const srcPath = path.join(process.cwd(), f.filename);
                if (!fs.existsSync(srcPath)) {
                  console.log(
                    'Model file not present in checkout (maybe deleted):',
                    srcPath
                  );
                  continue;
                }
                const baseName = path.basename(f.filename, '.json');
                const outPath = path.join('renders', `${baseName}.png`);
                console.log('Rendering model', srcPath, '->', outPath);
                const ok = await renderModelFile(srcPath, outPath);
                if (ok) {
                  renderedPaths.push(outPath);
                }
              }

              if (!renderedPaths.length) {
                console.log('No model renders produced, skipping Discord call.');
                process.exit(0);
              }

              const selected = renderedPaths.slice(0, 10);
              console.log('Sending collage of', selected.length, 'render(s)');
              await sendCollageToDiscord(selected);
              process.exit(0);
            } catch (err) {
              console.error('Error in workflow:', err);
              process.exit(1);
            }
          })();
          EOF
