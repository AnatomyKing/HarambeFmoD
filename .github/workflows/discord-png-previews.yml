name: Discord PNG previews

on:
  push:
    branches:
      - '**'   # run on any branch

jobs:
  send-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Send PNG previews to Discord
        uses: actions/github-script@v8
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;
            if (!webhook) {
              core.setFailed('DISCORD_WEBHOOK secret is not set');
              return;
            }

            const payload = context.payload;
            const repoFull = payload.repository.full_name;
            const headSha = payload.after || (payload.head_commit && payload.head_commit.id);

            const imageFiles = [];

            for (const commit of payload.commits || []) {
              const files = [
                ...(commit.added || []),
                ...(commit.modified || []),
              ];

              for (const path of files) {
                if (path.toLowerCase().endsWith('.png')) {
                  imageFiles.push({
                    path,
                    author: (commit.author && commit.author.name) || 'unknown',
                    message: commit.message || '',
                  });
                }
              }
            }

            if (!imageFiles.length) {
              core.info('No PNG files changed in this push, skipping.');
              return;
            }

            const embeds = imageFiles.slice(0, 10).map(file => {
              const rawUrl  = `https://raw.githubusercontent.com/${repoFull}/${headSha}/${file.path}`;
              const blobUrl = `https://github.com/${repoFull}/blob/${headSha}/${file.path}`;

              return {
                title: file.path,
                url: blobUrl,
                description: `Commit by **${file.author}**\n${file.message}`,
                image: { url: rawUrl },
              };
            });

            const body = {
              content: `🖼️ ${imageFiles.length} PNG file(s) updated in \`${repoFull}\`.`,
              embeds,
            };

            const res = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });

            const text = await res.text();
            core.info(`Discord response: ${res.status} ${text}`);

            if (!res.ok) {
              core.setFailed(`Discord webhook error ${res.status}: ${text}`);
            } else {
              core.info('Sent PNG previews to Discord.');
            }
