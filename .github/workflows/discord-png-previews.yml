name: Discord PNG previews

on:
  push:
    branches:
      - '**'   # run on any branch that has this workflow

jobs:
  send-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp
        run: npm install sharp

      - name: Build collage and send to Discord (HD, grouped by size)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - << 'EOF'
          const sharp = require('sharp');
          const fs = require('fs');
          const https = require('https');

          const webhook = process.env.DISCORD_WEBHOOK;
          if (!webhook) {
            console.error('DISCORD_WEBHOOK secret is not set');
            process.exit(1);
          }

          // GitHub event payload
          const payloadPath = process.env.GITHUB_EVENT_PATH;
          const payload = JSON.parse(fs.readFileSync(payloadPath, 'utf8'));
          const repoFull = payload.repository.full_name;
          const headSha = payload.after || (payload.head_commit && payload.head_commit.id);
          const baseSha = payload.before;

          console.log('Repo:', repoFull);
          console.log('Base SHA (before):', baseSha);
          console.log('Head SHA (after):', headSha);

          if (!baseSha || !headSha || baseSha === headSha) {
            console.log('No base/head to compare (maybe force-push or initial commit), skipping.');
            process.exit(0);
          }

          const [owner, repo] = repoFull.split('/');

          function ghRequest(pathname) {
            const token = process.env.GITHUB_TOKEN;
            const options = {
              hostname: 'api.github.com',
              path: pathname,
              method: 'GET',
              headers: {
                'User-Agent': 'github-actions',
                'Accept': 'application/vnd.github+json',
              }
            };
            if (token) {
              options.headers.Authorization = `Bearer ${token}`;
            }
            return new Promise((resolve, reject) => {
              https.get(options, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve(JSON.parse(data));
                  } else {
                    reject(new Error(`GitHub API ${res.statusCode}: ${data}`));
                  }
                });
              }).on('error', reject);
            });
          }

          // Download a file as Buffer
          function downloadBuffer(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                if (res.statusCode !== 200) {
                  reject(new Error(`Download ${url} failed: ${res.statusCode}`));
                  return;
                }
                const chunks = [];
                res.on('data', chunk => chunks.push(chunk));
                res.on('end', () => resolve(Buffer.concat(chunks)));
              }).on('error', reject);
            });
          }

          // Send a single collage buffer to Discord as a webhook message
          function sendCollageToDiscord(collageBuffer, groupKey) {
            return new Promise((resolve, reject) => {
              const httpsReq = require('https').request;
              const payloadJson = JSON.stringify({
                content: `PNG previews for size **${groupKey}**`,
                embeds: [
                  {
                    image: { url: 'attachment://collage.png' }
                  }
                ]
              });

              const boundary = '----WebKitFormBoundary7MA4YWxkTrZu0gW';
              const preamble =
                `--${boundary}\r\n` +
                `Content-Disposition: form-data; name="payload_json"\r\n` +
                `Content-Type: application/json\r\n\r\n` +
                payloadJson + `\r\n` +
                `--${boundary}\r\n` +
                `Content-Disposition: form-data; name="file"; filename="collage.png"\r\n` +
                `Content-Type: image/png\r\n\r\n`;
              const closing = `\r\n--${boundary}--\r\n`;

              const options = new URL(webhook);
              options.method = 'POST';
              options.headers = {
                'Content-Type': 'multipart/form-data; boundary=' + boundary,
              };

              const req = httpsReq(options, res => {
                let respData = '';
                res.on('data', chunk => respData += chunk);
                res.on('end', () => {
                  console.log(`Discord response for group ${groupKey}:`, res.statusCode, respData);
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error(`Discord returned status ${res.statusCode}`));
                  } else {
                    resolve();
                  }
                });
              });

              req.on('error', err => {
                console.error('Error sending to Discord:', err);
                reject(err);
              });

              req.write(preamble);
              req.write(collageBuffer);
              req.write(closing);
              req.end();
            });
          }

          (async () => {
            try {
              const comparePath = `/repos/${owner}/${repo}/compare/${baseSha}...${headSha}`;
              console.log('Calling GitHub compare API:', comparePath);
              const compare = await ghRequest(comparePath);
              const files = compare.files || [];
              console.log('Compare returned', files.length, 'file(s)');

              const pngFiles = files.filter(
                f => typeof f.filename === 'string' && f.filename.toLowerCase().endsWith('.png')
              );

              if (!pngFiles.length) {
                console.log('No PNG files changed in this push, skipping Discord call.');
                process.exit(0);
              }

              console.log('PNG files:', pngFiles.map(f => f.filename).join(', '));

              const selected = pngFiles.slice(0, 10); // safety limit

              // Download PNGs
              const buffers = [];
              for (const f of selected) {
                const rawUrl = `https://raw.githubusercontent.com/${repoFull}/${headSha}/${f.filename}`;
                console.log('Downloading', rawUrl);
                const buf = await downloadBuffer(rawUrl);
                buffers.push(buf);
              }

              // Determine original sizes
              const metas = await Promise.all(buffers.map(b => sharp(b).metadata()));
              const items = buffers.map((buf, idx) => {
                const m = metas[idx] || {};
                const width = m.width || 0;
                const height = m.height || 0;
                const key = `${width}x${height}`;
                console.log(`File index ${idx} => size ${key}`);
                return { buf, width, height, key };
              });

              // Group by size (width x height)
              const groups = {};
              for (const item of items) {
                if (!groups[item.key]) {
                  groups[item.key] = [];
                }
                groups[item.key].push(item);
              }

              const groupKeys = Object.keys(groups);
              console.log('Found size groups:', groupKeys.join(', '));

              // For each group, build collage and send separate Discord message
              for (const groupKey of groupKeys) {
                const groupItems = groups[groupKey];
                console.log(`Building collage for group ${groupKey} with ${groupItems.length} image(s)`);

                // All images in group share same size, but be safe and compute maxHeight
                const heights = groupItems.map(i => i.height || 0);
                const maxHeight = Math.max(...heights);
                console.log(`Original max height for group ${groupKey}:`, maxHeight);

                // Resize all to same height
                const resizedBuffers = await Promise.all(
                  groupItems.map(i =>
                    sharp(i.buf)
                      .resize({ height: maxHeight })
                      .toBuffer()
                  )
                );
                const resizedMetas = await Promise.all(resizedBuffers.map(b => sharp(b).metadata()));
                const resizedWidths = resizedMetas.map(m => m.width || 0);

                // Compute total width
                let x = 0;
                const composites = [];
                for (let i = 0; i < resizedBuffers.length; i++) {
                  composites.push({
                    input: resizedBuffers[i],
                    left: x,
                    top: 0,
                  });
                  x += resizedWidths[i];
                }

                console.log(`Collage base size for group ${groupKey}: ${x} x ${maxHeight}`);

                // Create base collage for this group
                let collageBuffer = await sharp({
                  create: {
                    width: x,
                    height: maxHeight,
                    channels: 4,
                    background: { r: 0, g: 0, b: 0, alpha: 0 },
                  }
                }).composite(composites).png().toBuffer();

                // HD UPSCALE (4x) with NEAREST for crisp pixel art
                const SCALE = 4;
                collageBuffer = await sharp(collageBuffer)
                  .resize({
                    width: Math.round(x * SCALE),
                    height: Math.round(maxHeight * SCALE),
                    kernel: sharp.kernel.nearest,
                  })
                  .png()
                  .toBuffer();

                console.log(
                  `Upscaled collage size for group ${groupKey}:`,
                  Math.round(x * SCALE),
                  'x',
                  Math.round(maxHeight * SCALE)
                );

                // Send this group's collage to Discord
                await sendCollageToDiscord(collageBuffer, groupKey);
              }

              console.log('All collages sent successfully.');
              process.exit(0);
            } catch (err) {
              console.error('Error in workflow:', err);
              process.exit(1);
            }
          })();
          EOF
