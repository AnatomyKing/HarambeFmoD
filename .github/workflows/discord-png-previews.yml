name: Discord model previews

on:
  push:
    branches:
      - '**'   # run on any branch

jobs:
  send-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: |
          npm install sharp esbuild puppeteer @iskallia-dev/item-model-renderer

      - name: Render changed models and send collage to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const sharp = require('sharp');
          const esbuild = require('esbuild');
          const puppeteer = require('puppeteer');

          const webhook = process.env.DISCORD_WEBHOOK;
          if (!webhook) {
            console.error('DISCORD_WEBHOOK secret is not set');
            process.exit(1);
          }

          // --- GitHub helpers -------------------------------------------------

          const payloadPath = process.env.GITHUB_EVENT_PATH;
          const payload = JSON.parse(fs.readFileSync(payloadPath, 'utf8'));
          const repoFull = payload.repository.full_name;
          const headSha = payload.after || (payload.head_commit && payload.head_commit.id);
          const baseSha = payload.before;

          console.log('Repo:', repoFull);
          console.log('Base SHA (before):', baseSha);
          console.log('Head SHA (after):', headSha);

          if (!baseSha || !headSha || baseSha === headSha) {
            console.log('No base/head to compare (maybe force-push or initial commit), skipping.');
            process.exit(0);
          }

          const [owner, repo] = repoFull.split('/');

          function ghRequest(pathname) {
            const token = process.env.GITHUB_TOKEN;
            const options = {
              hostname: 'api.github.com',
              path: pathname,
              method: 'GET',
              headers: {
                'User-Agent': 'github-actions',
                'Accept': 'application/vnd.github+json',
              }
            };
            if (token) {
              options.headers.Authorization = `Bearer ${token}`;
            }
            return new Promise((resolve, reject) => {
              https.get(options, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    try {
                      resolve(JSON.parse(data));
                    } catch (e) {
                      reject(new Error(`Failed to parse GitHub API JSON: ${e.message}`));
                    }
                  } else {
                    reject(new Error(`GitHub API ${res.statusCode}: ${data}`));
                  }
                });
              }).on('error', reject);
            });
          }

          // --- Texture path resolution ----------------------------------------

          function resolveTexturePath(ref) {
            if (!ref || typeof ref !== 'string') return null;
            if (ref.startsWith('builtin/')) return null;

            let namespace = 'minecraft';
            let key = ref;

            const parts = ref.split(':');
            if (parts.length === 2) {
              namespace = parts[0];
              key = parts[1];
            }

            const texRel = key.replace(/\//g, path.sep) + '.png';

            return path.join(
              'src',
              'main',
              'resources',
              'assets',
              namespace,
              'textures',
              texRel
            );
          }

          // --- Build item-model-renderer bundle (once) ------------------------

          async function buildRendererBundle() {
            const entrySource = `
              import React from 'react';
              import { createRoot } from 'react-dom/client';
              import { ItemModelGlProvider, ItemModelDisplayer } from '@iskallia-dev/item-model-renderer';

              const textureResolver = (resourceLocation) => {
                const map = window.__TEXTURE_MAP__ || {};
                if (map[resourceLocation]) return map[resourceLocation];
                if (map['default']) return map['default'];
                const keys = Object.keys(map);
                if (keys.length > 0) return map[keys[0]];
                return '';
              };

              const mcmetaResolver = async () => null;

              function App() {
                const itemModel = window.__ITEM_MODEL__;
                const zoomFactor = window.__ZOOM_FACTOR__ || 1.0;

                return React.createElement(
                  ItemModelGlProvider,
                  {
                    resolveTextureUrl: textureResolver,
                    resolveMcmeta: mcmetaResolver,
                    itemModelTransform: 'gui',
                    zoomFactor,
                  },
                  React.createElement(
                    'div',
                    {
                      style: {
                        width: '256px',
                        height: '256px',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                      },
                    },
                    React.createElement(ItemModelDisplayer, {
                      itemId: 'item',
                      itemModel,
                      renderedSize: 256,
                      className: 'item-preview-image',
                    })
                  )
                );
              }

              const rootElement = document.getElementById('root');
              if (rootElement) {
                const root = createRoot(rootElement);
                root.render(React.createElement(App));
              }
            `;

            const result = await esbuild.build({
              stdin: {
                contents: entrySource,
                loader: 'js',
                resolveDir: process.cwd(),
              },
              bundle: true,
              platform: 'browser',
              format: 'iife',
              write: false,
            });

            return result.outputFiles[0].text;
          }

          // --- Puppeteer rendering -------------------------------------------

          async function renderModelWithPuppeteer(page, rendererBundleJs, model, textureMap) {
            const html = `
              <!DOCTYPE html>
              <html>
                <head>
                  <meta charset="utf-8" />
                  <style>
                    html, body {
                      margin: 0;
                      padding: 0;
                      width: 100%;
                      height: 100%;
                      background: transparent;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      overflow: hidden;
                    }
                    #root {
                      width: 256px;
                      height: 256px;
                    }
                  </style>
                </head>
                <body>
                  <script>
                    window.__ITEM_MODEL__ = ${JSON.stringify(model)};
                    window.__TEXTURE_MAP__ = ${JSON.stringify(textureMap)};
                    window.__ZOOM_FACTOR__ = 1.0;
                  </script>
                  <div id="root"></div>
                  <script>
                    ${rendererBundleJs.replace(/<\/script/gi, '<\\/script')}
                  </script>
                </body>
              </html>
            `;

            await page.setContent(html, { waitUntil: 'load' });

            await page.waitForFunction(() => {
              const img = document.querySelector('img.item-preview-image');
              if (!img) return false;
              const src = img.src || '';
              return src.startsWith('data:image');
            }, { timeout: 20000 });

            const dataUrl = await page.evaluate(() => {
              const img = document.querySelector('img.item-preview-image');
              return img ? img.src : null;
            });

            if (!dataUrl) {
              throw new Error('Renderer did not produce an image data URL');
            }

            const base64 = dataUrl.split(',')[1] || '';
            return Buffer.from(base64, 'base64');
          }

          // --- Discord sending ------------------------------------------------

          async function sendCollageToDiscord(imagePaths) {
            if (!imagePaths.length) {
              console.log('No images to send to Discord.');
              return;
            }

            const buffers = imagePaths.map(p => fs.readFileSync(p));
            const metas = await Promise.all(buffers.map(b => sharp(b).metadata()));
            const heights = metas.map(m => m.height || 0);
            const maxHeight = Math.max(...heights);

            console.log('Original max height:', maxHeight);

            const resizedBuffers = await Promise.all(
              buffers.map(b => sharp(b).resize({ height: maxHeight }).toBuffer())
            );
            const resizedMetas = await Promise.all(
              resizedBuffers.map(b => sharp(b).metadata())
            );
            const resizedWidths = resizedMetas.map(m => m.width || 0);

            let x = 0;
            const composites = [];
            for (let i = 0; i < resizedBuffers.length; i++) {
              composites.push({
                input: resizedBuffers[i],
                left: x,
                top: 0,
              });
              x += resizedWidths[i];
            }

            console.log('Collage base size:', x, 'x', maxHeight);

            let collageBuffer = await sharp({
              create: {
                width: x,
                height: maxHeight,
                channels: 4,
                background: { r: 0, g: 0, b: 0, alpha: 0 },
              }
            }).composite(composites).png().toBuffer();

            const SCALE = 4;
            collageBuffer = await sharp(collageBuffer)
              .resize({
                width: Math.round(x * SCALE),
                height: Math.round(maxHeight * SCALE),
                kernel: sharp.kernel.nearest,
              })
              .png()
              .toBuffer();

            console.log(
              'Upscaled collage size:',
              Math.round(x * SCALE),
              'x',
              Math.round(maxHeight * SCALE)
            );

            const payloadJson = JSON.stringify({
              embeds: [
                {
                  image: { url: 'attachment://collage.png' }
                }
              ]
            });

            const boundary = '----WebKitFormBoundary7MA4YWxkTrZu0gW';
            const preamble =
              `--${boundary}\r\n` +
              `Content-Disposition: form-data; name="payload_json"\r\n` +
              `Content-Type: application/json\r\n\r\n` +
              payloadJson + `\r\n` +
              `--${boundary}\r\n` +
              `Content-Disposition: form-data; name="file"; filename="collage.png"\r\n` +
              `Content-Type: image/png\r\n\r\n`;
            const closing = `\r\n--${boundary}--\r\n`;

            const options = new URL(webhook);
            options.method = 'POST';
            options.headers = {
              'Content-Type': 'multipart/form-data; boundary=' + boundary,
            };

            await new Promise((resolve, reject) => {
              const req = https.request(options, res => {
                let respData = '';
                res.on('data', chunk => respData += chunk);
                res.on('end', () => {
                  console.log('Discord response:', res.statusCode, respData);
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error('Discord returned non-2xx status'));
                  } else {
                    resolve();
                  }
                });
              });

              req.on('error', err => {
                console.error('Error sending to Discord:', err);
                reject(err);
              });

              req.write(preamble);
              req.write(collageBuffer);
              req.write(closing);
              req.end();
            });
          }

          // --- Main -----------------------------------------------------------

          (async () => {
            try {
              const comparePath = `/repos/${owner}/${repo}/compare/${baseSha}...${headSha}`;
              console.log('Calling GitHub compare API:', comparePath);
              const compare = await ghRequest(comparePath);
              const files = compare.files || [];
              console.log('Compare returned', files.length, 'file(s)');

              const modelFiles = files.filter(
                f =>
                  typeof f.filename === 'string' &&
                  f.filename.toLowerCase().endsWith('.json') &&
                  f.filename.includes('src/main/resources/assets/') &&
                  f.filename.includes('/models/')
              );

              if (!modelFiles.length) {
                console.log('No model JSON files changed in this push, skipping Discord call.');
                process.exit(0);
              }

              console.log(
                'Model JSON files:',
                modelFiles.map(f => f.filename).join(', ')
              );

              console.log('Building renderer bundle with esbuild...');
              const rendererBundleJs = await buildRendererBundle();

              const browser = await puppeteer.launch({
                headless: 'new',
                args: ['--no-sandbox', '--disable-setuid-sandbox'],
              });
              const page = await browser.newPage();
              await page.setViewport({ width: 512, height: 512, deviceScaleFactor: 2 });

              fs.mkdirSync('renders', { recursive: true });

              const renderedPaths = [];

              for (const f of modelFiles) {
                const srcPath = path.join(process.cwd(), f.filename);
                if (!fs.existsSync(srcPath)) {
                  console.log('Model file not present in checkout (maybe deleted):', srcPath);
                  continue;
                }

                let model;
                try {
                  model = JSON.parse(fs.readFileSync(srcPath, 'utf8'));
                } catch (err) {
                  console.error('Failed to parse model JSON:', srcPath, err);
                  continue;
                }

                const texturesDef = model.textures || {};
                const textureMap = {};
                for (const [, ref] of Object.entries(texturesDef)) {
                  const resLoc = typeof ref === 'string' ? ref : null;
                  if (!resLoc) continue;
                  const texPath = resolveTexturePath(resLoc);
                  if (!texPath || !fs.existsSync(texPath)) {
                    console.warn('Texture file not found for', resLoc, '->', texPath);
                    continue;
                  }
                  const imgBuffer = fs.readFileSync(texPath);
                  const dataUrl = 'data:image/png;base64,' + imgBuffer.toString('base64');
                  textureMap[resLoc] = dataUrl;
                  if (!textureMap.default) textureMap.default = dataUrl;
                }

                if (!Object.keys(textureMap).length) {
                  console.warn('No textures could be loaded for model', srcPath);
                  continue;
                }

                const baseName = path.basename(f.filename, '.json');
                const outPath = path.join('renders', `${baseName}.png`);
                console.log('Rendering model', srcPath, '->', outPath);

                try {
                  const pngBuffer = await renderModelWithPuppeteer(page, rendererBundleJs, model, textureMap);
                  fs.writeFileSync(outPath, pngBuffer);
                  renderedPaths.push(outPath);
                } catch (err) {
                  console.error('Failed to render model', srcPath, err);
                }
              }

              await browser.close();

              if (!renderedPaths.length) {
                console.log('No model renders produced, skipping Discord call.');
                process.exit(0);
              }

              const selected = renderedPaths.slice(0, 10);
              console.log('Sending collage of', selected.length, 'render(s)');
              await sendCollageToDiscord(selected);
              process.exit(0);
            } catch (err) {
              console.error('Error in workflow:', err);
              process.exit(1);
            }
          })();
          EOF
