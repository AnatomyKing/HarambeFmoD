name: Discord PNG previews

on:
  push:
    branches:
      - '**'   # run on any branch that has this workflow

jobs:
  send-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Send PNG previews to Discord
        uses: actions/github-script@v8
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;
            if (!webhook) {
              core.setFailed('DISCORD_WEBHOOK secret is not set');
              return;
            }

            const payload = context.payload;
            const repoFull = payload.repository.full_name;
            const headSha = payload.after || (payload.head_commit && payload.head_commit.id);
            const baseSha = payload.before;

            core.info(`Repo: ${repoFull}`);
            core.info(`Base SHA (before): ${baseSha}`);
            core.info(`Head SHA (after): ${headSha}`);

            if (!baseSha || !headSha || baseSha === headSha) {
              core.info('No base/head to compare (maybe force-push or initial commit), skipping.');
              return;
            }

            // Use the GitHub REST API to get changed files between base and head
            const { owner, repo } = context.repo;
            const compare = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: baseSha,
              head: headSha,
            });

            const files = compare.data.files || [];
            core.info(`Compare API returned ${files.length} file(s).`);

            const imageFiles = files
              .filter(f => typeof f.filename === 'string' && f.filename.toLowerCase().endsWith('.png'))
              .map(f => ({
                path: f.filename,
                status: f.status,
              }));

            if (!imageFiles.length) {
              core.info('No PNG files changed in this push (via compare API), skipping Discord call.');
              return;
            }

            core.info(`PNG files detected: ${imageFiles.map(f => f.path).join(', ')}`);

            // Build embeds: image-only, no text, no links
            const embeds = imageFiles.slice(0, 10).map(file => {
              const rawUrl  = `https://raw.githubusercontent.com/${repoFull}/${headSha}/${file.path}`;
              return {
                image: { url: rawUrl },
              };
            });

            const body = {
              embeds,  // no "content", no titles, no descriptions, no URLs
            };

            const res = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });

            const text = await res.text();
            core.info(`Discord response: ${res.status} ${text}`);

            if (!res.ok) {
              core.setFailed(`Discord webhook error ${res.status}: ${text}`);
            } else {
              core.info('Sent PNG previews to Discord.');
            }
