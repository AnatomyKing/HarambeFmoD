name: Discord model previews

on:
  push:
    branches:
      - '**'   # run on any branch

jobs:
  send-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: |
          npm install \
            sharp \
            puppeteer \
            esbuild \
            @iskallia-dev/item-model-renderer \
            react \
            react-dom \
            three \
            @react-three/fiber \
            @react-three/drei

      - name: Render changed models and send collage to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const sharp = require('sharp');
          const puppeteer = require('puppeteer');
          const esbuild = require('esbuild');

          const webhook = process.env.DISCORD_WEBHOOK;
          if (!webhook) {
            console.error('DISCORD_WEBHOOK secret is not set');
            process.exit(1);
          }

          // GitHub event payload
          const payloadPath = process.env.GITHUB_EVENT_PATH;
          const payload = JSON.parse(fs.readFileSync(payloadPath, 'utf8'));
          const repoFull = payload.repository.full_name;
          const headSha = payload.after || (payload.head_commit && payload.head_commit.id);
          const baseSha = payload.before;

          console.log('Repo:', repoFull);
          console.log('Base SHA (before):', baseSha);
          console.log('Head SHA (after):', headSha);

          if (!baseSha || !headSha || baseSha === headSha) {
            console.log('No base/head to compare (maybe force-push or initial commit), skipping.');
            process.exit(0);
          }

          const [owner, repo] = repoFull.split('/');

          function ghRequest(pathname) {
            const token = process.env.GITHUB_TOKEN;
            const options = {
              hostname: 'api.github.com',
              path: pathname,
              method: 'GET',
              headers: {
                'User-Agent': 'github-actions',
                'Accept': 'application/vnd.github+json',
              }
            };
            if (token) {
              options.headers.Authorization = `Bearer ${token}`;
            }
            return new Promise((resolve, reject) => {
              https.get(options, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    try {
                      resolve(JSON.parse(data));
                    } catch (e) {
                      reject(new Error(`Failed to parse GitHub API JSON: ${e.message}`));
                    }
                  } else {
                    reject(new Error(`GitHub API ${res.statusCode}: ${data}`));
                  }
                });
              }).on('error', reject);
            });
          }

          // Resolve texture reference like "harambefmod:item/anyphone" -> actual PNG path
          function resolveTexturePath(ref) {
            if (!ref || typeof ref !== 'string') return null;
            if (ref.startsWith('builtin/')) return null;

            let namespace = 'minecraft';
            let pathKey = ref;

            const parts = ref.split(':');
            if (parts.length === 2) {
              namespace = parts[0];
              pathKey = parts[1];
            }

            const texPath = pathKey.replace(/\//g, path.sep) + '.png';
            return path.join(
              'src', 'main', 'resources',
              'assets', namespace,
              'textures',
              texPath
            );
          }

          // Create the React entry file that uses @iskallia-dev/item-model-renderer
          function ensureRendererApp() {
            const entryPath = path.join(process.cwd(), 'renderer-entry.jsx');
            const htmlPath = path.join(process.cwd(), 'renderer.html');

            if (!fs.existsSync(entryPath)) {
              fs.writeFileSync(entryPath, `
                import React from "react";
                import ReactDOM from "react-dom/client";
                import { ItemModelGlProvider, ItemModelDisplayer } from "@iskallia-dev/item-model-renderer";

                const model = window.__ITEM_MODEL__;
                const textureMap = window.__TEXTURE_MAP__ || {};

                const textureResolver = (resourceLocation) => {
                  if (textureMap[resourceLocation]) return textureMap[resourceLocation];
                  const first = Object.values(textureMap)[0];
                  return first || "";
                };

                const mcmetaResolver = async () => null;

                const App = () => (
                  <div style={{ width: "512px", height: "512px", display: "flex", alignItems: "center", justifyContent: "center", backgroundColor: "transparent" }}>
                    <ItemModelGlProvider
                      resolveTextureUrl={textureResolver}
                      resolveMcmeta={mcmetaResolver}
                      itemModelTransform="gui"
                      zoomFactor={1}
                    >
                      <ItemModelDisplayer
                        itemId="preview"
                        itemModel={model}
                        renderedSize={512}
                        className="item-preview-image"
                      />
                    </ItemModelGlProvider>
                  </div>
                );

                const rootEl = document.getElementById("root");
                const root = ReactDOM.createRoot(rootEl);
                root.render(<App />);
              `);
            }

            if (!fs.existsSync(htmlPath)) {
              fs.writeFileSync(htmlPath, `
                <!DOCTYPE html>
                <html>
                <head>
                  <meta charset="utf-8" />
                  <title>Item Model Renderer</title>
                  <style>
                    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; }
                    #root { width: 512px; height: 512px; margin: 0; }
                  </style>
                </head>
                <body>
                  <div id="root"></div>
                  <script src="renderer-bundle.js"></script>
                </body>
                </html>
              `);
            }

            return { entryPath, htmlPath };
          }

          async function buildRendererBundle(entryPath) {
            console.log('Building renderer bundle with esbuild...');
            await esbuild.build({
              entryPoints: [entryPath],
              outfile: 'renderer-bundle.js',
              bundle: true,
              platform: 'browser',
              format: 'iife',
              globalName: 'ItemModelRendererApp',
              loader: { '.jsx': 'jsx' },
              define: { 'process.env.NODE_ENV': '"production"' },
              logLevel: 'error'
            });
          }

          async function renderModelWithPuppeteer(model, textureMap, outPath, htmlPath) {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            try {
              const page = await browser.newPage();

              await page.evaluateOnNewDocument((m, t) => {
                window.__ITEM_MODEL__ = m;
                window.__TEXTURE_MAP__ = t;
              }, model, textureMap);

              await page.goto('file://' + htmlPath, { waitUntil: 'networkidle0' });

              await page.waitForSelector('img.item-preview-image', { timeout: 10000 });

              await page.waitForFunction(() => {
                const img = document.querySelector('img.item-preview-image');
                return img && typeof img.src === 'string' && img.src.startsWith('data:image');
              }, { timeout: 10000 });

              const dataUrl = await page.$eval('img.item-preview-image', img => img.src);
              const base64 = dataUrl.split(',')[1];
              const buf = Buffer.from(base64, 'base64');
              fs.writeFileSync(outPath, buf);
              console.log('Rendered model saved to', outPath);
            } finally {
              await browser.close();
            }
          }

          async function sendCollageToDiscord(imagePaths) {
            if (!imagePaths.length) {
              console.log('No images to send to Discord.');
              return;
            }

            const buffers = imagePaths.map(p => fs.readFileSync(p));
            const metas = await Promise.all(buffers.map(b => sharp(b).metadata()));
            const heights = metas.map(m => m.height || 0);
            const maxHeight = Math.max(...heights);

            console.log('Original max height:', maxHeight);

            const resizedBuffers = await Promise.all(
              buffers.map(b => sharp(b).resize({ height: maxHeight }).toBuffer())
            );
            const resizedMetas = await Promise.all(
              resizedBuffers.map(b => sharp(b).metadata())
            );
            const resizedWidths = resizedMetas.map(m => m.width || 0);

            let x = 0;
            const composites = [];
            for (let i = 0; i < resizedBuffers.length; i++) {
              composites.push({
                input: resizedBuffers[i],
                left: x,
                top: 0,
              });
              x += resizedWidths[i];
            }

            console.log('Collage base size:', x, 'x', maxHeight);

            let collageBuffer = await sharp({
              create: {
                width: x,
                height: maxHeight,
                channels: 4,
                background: { r: 0, g: 0, b: 0, alpha: 0 },
              }
            }).composite(composites).png().toBuffer();

            const SCALE = 4;
            collageBuffer = await sharp(collageBuffer)
              .resize({
                width: Math.round(x * SCALE),
                height: Math.round(maxHeight * SCALE),
                kernel: sharp.kernel.nearest,
              })
              .png()
              .toBuffer();

            console.log(
              'Upscaled collage size:',
              Math.round(x * SCALE),
              'x',
              Math.round(maxHeight * SCALE)
            );

            const payloadJson = JSON.stringify({
              embeds: [
                {
                  image: { url: 'attachment://collage.png' }
                }
              ]
            });

            const boundary = '----WebKitFormBoundary7MA4YWxkTrZu0gW';
            const preamble =
              `--${boundary}\r\n` +
              `Content-Disposition: form-data; name="payload_json"\r\n` +
              `Content-Type: application/json\r\n\r\n` +
              payloadJson + `\r\n` +
              `--${boundary}\r\n` +
              `Content-Disposition: form-data; name="file"; filename="collage.png"\r\n` +
              `Content-Type: image/png\r\n\r\n`;
            const closing = `\r\n--${boundary}--\r\n`;

            const options = new URL(webhook);
            options.method = 'POST';
            options.headers = {
              'Content-Type': 'multipart/form-data; boundary=' + boundary,
            };

            await new Promise((resolve, reject) => {
              const req = https.request(options, res => {
                let respData = '';
                res.on('data', chunk => respData += chunk);
                res.on('end', () => {
                  console.log('Discord response:', res.statusCode, respData);
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error('Discord returned non-2xx status'));
                  } else {
                    resolve();
                  }
                });
              });

              req.on('error', err => {
                console.error('Error sending to Discord:', err);
                reject(err);
              });

              req.write(preamble);
              req.write(collageBuffer);
              req.write(closing);
              req.end();
            });
          }

          (async () => {
            try {
              const comparePath = `/repos/${owner}/${repo}/compare/${baseSha}...${headSha}`;
              console.log('Calling GitHub compare API:', comparePath);
              const compare = await ghRequest(comparePath);
              const files = compare.files || [];
              console.log('Compare returned', files.length, 'file(s)');

              const modelFiles = files.filter(
                f =>
                  typeof f.filename === 'string' &&
                  f.filename.toLowerCase().endsWith('.json') &&
                  f.filename.includes('src/main/resources/assets/') &&
                  f.filename.includes('/models/')
              );

              if (!modelFiles.length) {
                console.log('No model JSON files changed in this push, skipping Discord call.');
                process.exit(0);
              }

              console.log(
                'Model JSON files:',
                modelFiles.map(f => f.filename).join(', ')
              );

              fs.mkdirSync('renders', { recursive: true });

              const { entryPath, htmlPath } = ensureRendererApp();
              await buildRendererBundle(entryPath);

              const renderedPaths = [];
              for (const f of modelFiles) {
                const srcPath = path.join(process.cwd(), f.filename);
                if (!fs.existsSync(srcPath)) {
                  console.log('Model file not present in checkout (maybe deleted):', srcPath);
                  continue;
                }

                let modelJson;
                try {
                  modelJson = JSON.parse(fs.readFileSync(srcPath, 'utf8'));
                } catch (err) {
                  console.error('Failed to parse model JSON:', srcPath, err);
                  continue;
                }

                const texturesDef = modelJson.textures || {};
                const textureMap = {};
                for (const ref of Object.values(texturesDef)) {
                  if (typeof ref !== 'string') continue;
                  if (textureMap[ref]) continue;

                  const texPath = resolveTexturePath(ref);
                  if (!texPath || !fs.existsSync(texPath)) {
                    console.warn('Texture not found for', ref, '->', texPath);
                    continue;
                  }
                  const buf = fs.readFileSync(texPath);
                  textureMap[ref] = 'data:image/png;base64,' + buf.toString('base64');
                }

                if (!Object.keys(textureMap).length) {
                  console.warn('No textures could be resolved for model', srcPath);
                  continue;
                }

                const baseName = path.basename(f.filename, '.json');
                const outPath = path.join('renders', `${baseName}.png`);

                console.log('Rendering model', srcPath, '->', outPath);
                await renderModelWithPuppeteer(modelJson, textureMap, outPath, path.join(process.cwd(), 'renderer.html'));
                renderedPaths.push(outPath);
              }

              if (!renderedPaths.length) {
                console.log('No model renders produced, skipping Discord call.');
                process.exit(0);
              }

              const selected = renderedPaths.slice(0, 10);
              console.log('Sending collage of', selected.length, 'render(s)');
              await sendCollageToDiscord(selected);
              process.exit(0);
            } catch (err) {
              console.error('Error in workflow:', err);
              process.exit(1);
            }
          })();
          EOF
