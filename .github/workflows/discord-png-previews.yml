name: Discord PNG previews

on:
  push:
    branches:
      - '**'   # run on any branch that has this workflow

jobs:
  send-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Ensure ImageMagick is available
        run: |
          # jq & curl are already on ubuntu-latest; make sure ImageMagick is there
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build collage and send to Discord (HD)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PAYLOAD="$GITHUB_EVENT_PATH"

          REPO_FULL=$(jq -r '.repository.full_name' "$PAYLOAD")
          HEAD_SHA=$(jq -r '.after // .head_commit.id // empty' "$PAYLOAD")
          BASE_SHA=$(jq -r '.before // empty' "$PAYLOAD")

          echo "Repo: $REPO_FULL"
          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          if [ -z "$HEAD_SHA" ] || [ -z "$BASE_SHA" ] || [ "$HEAD_SHA" = "$BASE_SHA" ]; then
            echo "No base/head to compare; skipping."
            exit 0
          fi

          COMPARE_URL="https://api.github.com/repos/$REPO_FULL/compare/$BASE_SHA...$HEAD_SHA"
          echo "Calling $COMPARE_URL"

          COMPARE_JSON=$(curl -sS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$COMPARE_URL")

          mkdir -p tmp_pngs
          echo "$COMPARE_JSON" \
            | jq -r '.files[].filename' \
            | grep -i '\.png$' \
            | head -n 10 > tmp_pngs/list.txt || true

          if [ ! -s tmp_pngs/list.txt ]; then
            echo "No PNG files changed; skipping."
            exit 0
          fi

          i=0
          while IFS= read -r FILE; do
            i=$((i+1))
            RAW_URL="https://raw.githubusercontent.com/$REPO_FULL/$HEAD_SHA/$FILE"
            echo "Downloading $RAW_URL"
            curl -sS -L "$RAW_URL" -o "tmp_pngs/$i.png"
          done < tmp_pngs/list.txt

          if [ "$i" -eq 0 ]; then
            echo "No PNGs downloaded; skipping."
            exit 0
          fi

          echo "Downloaded $i PNG(s):"
          ls tmp_pngs

          # Horizontal collage with no gaps
          magick montage tmp_pngs/*.png -geometry +0+0 -tile x1 collage.png

          # HD upscale (4x) using nearest-neighbour-like sampling for crisp pixel art
          magick collage.png -sample 400%x400% collage_hd.png

          echo "Sending collage to Discord"

          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -F 'payload_json={"embeds":[{"image":{"url":"attachment://collage.png"}}]}' \
            -F "file=@collage_hd.png;filename=collage.png"
