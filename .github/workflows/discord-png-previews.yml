name: Discord model previews

on:
  push:
    branches:
      - '**'   # run on any branch

jobs:
  send-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # System deps needed for the `canvas` npm package
      - name: Install native deps for node-canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Install Node dependencies
        run: npm install sharp canvas

      - name: Render changed models and send collage to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const sharp = require('sharp');
          const { createCanvas, loadImage } = require('canvas');

          const webhook = process.env.DISCORD_WEBHOOK;
          if (!webhook) {
            console.error('DISCORD_WEBHOOK secret is not set');
            process.exit(1);
          }

          // GitHub event payload
          const payloadPath = process.env.GITHUB_EVENT_PATH;
          const payload = JSON.parse(fs.readFileSync(payloadPath, 'utf8'));
          const repoFull = payload.repository.full_name;
          const headSha = payload.after || (payload.head_commit && payload.head_commit.id);
          const baseSha = payload.before;

          console.log('Repo:', repoFull);
          console.log('Base SHA (before):', baseSha);
          console.log('Head SHA (after):', headSha);

          if (!baseSha || !headSha || baseSha === headSha) {
            console.log('No base/head to compare (maybe force-push or initial commit), skipping.');
            process.exit(0);
          }

          const [owner, repo] = repoFull.split('/');

          function ghRequest(pathname) {
            const token = process.env.GITHUB_TOKEN;
            const options = {
              hostname: 'api.github.com',
              path: pathname,
              method: 'GET',
              headers: {
                'User-Agent': 'github-actions',
                'Accept': 'application/vnd.github+json',
              }
            };
            if (token) {
              options.headers.Authorization = `Bearer ${token}`;
            }
            return new Promise((resolve, reject) => {
              https.get(options, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    try {
                      resolve(JSON.parse(data));
                    } catch (e) {
                      reject(new Error(`Failed to parse GitHub API JSON: ${e.message}`));
                    }
                  } else {
                    reject(new Error(`GitHub API ${res.statusCode}: ${data}`));
                  }
                });
              }).on('error', reject);
            });
          }

          // Resolve a texture reference like "harambefmod:item/anyphone" -> actual PNG path
          function resolveTexturePath(ref) {
            if (!ref || typeof ref !== 'string') return null;
            if (ref.startsWith('builtin/')) return null;

            let namespace = 'minecraft';
            let pathKey = ref;

            const parts = ref.split(':');
            if (parts.length === 2) {
              namespace = parts[0];
              pathKey = parts[1];
            }

            const texPath = pathKey.replace(/\//g, path.sep) + '.png';
            // Adjust this root if your layout differs
            return path.join(
              'src', 'main', 'resources',
              'assets', namespace,
              'textures',
              texPath
            );
          }

          async function renderModelFile(modelPath, outPath) {
            let model;
            try {
              const raw = fs.readFileSync(modelPath, 'utf8');
              model = JSON.parse(raw);
            } catch (err) {
              console.error('Failed to read/parse model', modelPath, err);
              return false;
            }

            const texturesDef = model.textures || {};
            const textureEntries = Object.entries(texturesDef);
            if (!textureEntries.length) {
              console.warn('Model has no textures:', modelPath);
              return false;
            }

            // Load all textures referenced in model.textures
            const textureCanvases = {};
            for (const [key, ref] of textureEntries) {
              const texPath = resolveTexturePath(ref);
              if (!texPath) {
                console.warn('Skipping non-file texture ref', ref, 'for key', key);
                continue;
              }
              if (!fs.existsSync(texPath)) {
                console.warn('Texture file not found:', texPath);
                continue;
              }
              try {
                const img = await loadImage(texPath);
                const c = createCanvas(img.width, img.height);
                const cctx = c.getContext('2d');
                cctx.drawImage(img, 0, 0);
                textureCanvases[key] = { canvas: c, ctx: cctx };
              } catch (err) {
                console.error('Failed loading texture', texPath, err);
              }
            }

            const textureKeys = Object.keys(textureCanvases);
            if (!textureKeys.length) {
              console.warn('No textures could be loaded for model', modelPath);
              return false;
            }

            const elements = model.elements || [];
            if (!elements.length) {
              console.warn('Model has no elements:', modelPath);
              return false;
            }

            // Compute rough bounding box (ignoring rotation for simplicity)
            let minX = Infinity, minY = Infinity, minZ = Infinity;
            let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;

            for (const el of elements) {
              const from = el.from || [0, 0, 0];
              const to = el.to || [0, 0, 0];
              const x0 = Math.min(from[0], to[0]);
              const x1 = Math.max(from[0], to[0]);
              const y0 = Math.min(from[1], to[1]);
              const y1 = Math.max(from[1], to[1]);
              const z0 = Math.min(from[2], to[2]);
              const z1 = Math.max(from[2], to[2]);

              if (x0 < minX) minX = x0;
              if (x1 > maxX) maxX = x1;
              if (y0 < minY) minY = y0;
              if (y1 > maxY) maxY = y1;
              if (z0 < minZ) minZ = z0;
              if (z1 > maxZ) maxZ = z1;
            }

            const cx = (minX + maxX) / 2;
            const cy = (minY + maxY) / 2;
            const cz = (minZ + maxZ) / 2;

            const spanX = maxX - minX;
            const spanY = maxY - minY;
            const spanZ = maxZ - minZ;
            const maxSpan = Math.max(spanX, spanY, spanZ) || 1;

            const width = 512;
            const height = 512;
            const canvas = createCanvas(width, height);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, width, height);

            const scale = (Math.min(width, height) * 0.6) / maxSpan;
            const angle = Math.PI / 6; // 30° for isometric-ish view

            function applyRotation(x, y, z, rot) {
              if (!rot || !rot.angle) return [x, y, z];
              const deg = rot.angle;
              if (!deg) return [x, y, z];
              const rad = (deg * Math.PI) / 180;
              const origin = rot.origin || [0, 0, 0];
              let X = x - origin[0];
              let Y = y - origin[1];
              let Z = z - origin[2];

              const cos = Math.cos(rad);
              const sin = Math.sin(rad);

              switch (rot.axis) {
                case 'x': {
                  const ny = Y * cos - Z * sin;
                  const nz = Y * sin + Z * cos;
                  Y = ny; Z = nz;
                  break;
                }
                case 'y': {
                  const nx = X * cos + Z * sin;
                  const nz = -X * sin + Z * cos;
                  X = nx; Z = nz;
                  break;
                }
                case 'z': {
                  const nx = X * cos - Y * sin;
                  const ny = X * sin + Y * cos;
                  X = nx; Y = ny;
                  break;
                }
              }

              return [X + origin[0], Y + origin[1], Z + origin[2]];
            }

            function projectVertex(x, y, z) {
              // center and scale
              let X = (x - cx) * scale;
              let Y = (y - cy) * scale;
              let Z = (z - cz) * scale;

              // simple isometric projection
              const sx = (X - Z) * Math.cos(angle);
              const sy = Y + (X + Z) * Math.sin(angle);
              return [sx, sy];
            }

            const shadeMap = {
              north: 0.75,
              south: 0.95,
              east: 0.85,
              west: 0.65,
              up: 1.0,
              down: 0.4,
            };

            const faces = [];

            for (const el of elements) {
              const from = el.from || [0, 0, 0];
              const to = el.to || [0, 0, 0];

              const x0 = Math.min(from[0], to[0]);
              const x1 = Math.max(from[0], to[0]);
              const y0 = Math.min(from[1], to[1]);
              const y1 = Math.max(from[1], to[1]);
              const z0 = Math.min(from[2], to[2]);
              const z1 = Math.max(from[2], to[2]);

              const rot = el.rotation || null;
              const f = el.faces || {};

              const faceVerts = {
                north: [
                  [x0, y0, z0],
                  [x1, y0, z0],
                  [x1, y1, z0],
                  [x0, y1, z0],
                ],
                south: [
                  [x1, y0, z1],
                  [x0, y0, z1],
                  [x0, y1, z1],
                  [x1, y1, z1],
                ],
                west: [
                  [x0, y0, z1],
                  [x0, y0, z0],
                  [x0, y1, z0],
                  [x0, y1, z1],
                ],
                east: [
                  [x1, y0, z0],
                  [x1, y0, z1],
                  [x1, y1, z1],
                  [x1, y1, z0],
                ],
                up: [
                  [x0, y1, z0],
                  [x1, y1, z0],
                  [x1, y1, z1],
                  [x0, y1, z1],
                ],
                down: [
                  [x0, y0, z1],
                  [x1, y0, z1],
                  [x1, y0, z0],
                  [x0, y0, z0],
                ],
              };

              for (const dir of Object.keys(f)) {
                if (!faceVerts[dir]) continue;
                const faceInfo = f[dir];
                const uv = faceInfo.uv || [0, 0, 16, 16];

                let texKey = null;
                if (typeof faceInfo.texture === 'string' && faceInfo.texture.startsWith('#')) {
                  texKey = faceInfo.texture.slice(1);
                }
                let tex = texKey && textureCanvases[texKey];
                if (!tex) {
                  tex = textureCanvases[textureKeys[0]];
                }
                if (!tex) continue;

                const vertsWorld = faceVerts[dir].map(([x, y, z]) =>
                  applyRotation(x, y, z, rot)
                );
                const verts2D = vertsWorld.map(([x, y, z]) => projectVertex(x, y, z));
                const depth = vertsWorld.reduce((acc, [, y, z]) => acc + y + z, 0) / vertsWorld.length;

                faces.push({
                  dir,
                  uv,
                  tex,
                  verts2D,
                  depth,
                });
              }
            }

            // back-to-front painter's algorithm
            faces.sort((a, b) => a.depth - b.depth);

            ctx.save();
            ctx.translate(width / 2, height * 0.75);
            ctx.scale(1, -1); // make Y up

            for (const face of faces) {
              const { dir, uv, tex, verts2D } = face;
              const [u1, v1, u2, v2] = uv;
              const cu = Math.max(
                0,
                Math.min(tex.canvas.width - 1, Math.floor((u1 + u2) / 2))
              );
              const cv = Math.max(
                0,
                Math.min(tex.canvas.height - 1, Math.floor((v1 + v2) / 2))
              );

              let pixel;
              try {
                pixel = tex.ctx.getImageData(cu, cv, 1, 1).data;
              } catch (e) {
                continue;
              }
              let r = pixel[0], g = pixel[1], b = pixel[2], a = pixel[3] / 255;
              const shade = shadeMap[dir] || 0.8;
              r = Math.max(0, Math.min(255, Math.round(r * shade)));
              g = Math.max(0, Math.min(255, Math.round(g * shade)));
              b = Math.max(0, Math.min(255, Math.round(b * shade)));

              ctx.beginPath();
              ctx.moveTo(verts2D[0][0], verts2D[0][1]);
              for (let i = 1; i < verts2D.length; i++) {
                ctx.lineTo(verts2D[i][0], verts2D[i][1]);
              }
              ctx.closePath();
              ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
              ctx.fill();
              ctx.lineWidth = 1;
              ctx.strokeStyle = 'rgba(0,0,0,0.2)';
              ctx.stroke();
            }

            ctx.restore();

            fs.writeFileSync(outPath, canvas.toBuffer('image/png'));
            return true;
          }

          async function sendCollageToDiscord(imagePaths) {
            if (!imagePaths.length) {
              console.log('No images to send to Discord.');
              return;
            }

            const buffers = imagePaths.map(p => fs.readFileSync(p));
            const metas = await Promise.all(buffers.map(b => sharp(b).metadata()));
            const heights = metas.map(m => m.height || 0);
            const maxHeight = Math.max(...heights);

            console.log('Original max height:', maxHeight);

            const resizedBuffers = await Promise.all(
              buffers.map(b => sharp(b).resize({ height: maxHeight }).toBuffer())
            );
            const resizedMetas = await Promise.all(
              resizedBuffers.map(b => sharp(b).metadata())
            );
            const resizedWidths = resizedMetas.map(m => m.width || 0);

            let x = 0;
            const composites = [];
            for (let i = 0; i < resizedBuffers.length; i++) {
              composites.push({
                input: resizedBuffers[i],
                left: x,
                top: 0,
              });
              x += resizedWidths[i];
            }

            console.log('Collage base size:', x, 'x', maxHeight);

            let collageBuffer = await sharp({
              create: {
                width: x,
                height: maxHeight,
                channels: 4,
                background: { r: 0, g: 0, b: 0, alpha: 0 },
              }
            }).composite(composites).png().toBuffer();

            const SCALE = 4;
            collageBuffer = await sharp(collageBuffer)
              .resize({
                width: Math.round(x * SCALE),
                height: Math.round(maxHeight * SCALE),
                kernel: sharp.kernel.nearest,
              })
              .png()
              .toBuffer();

            console.log(
              'Upscaled collage size:',
              Math.round(x * SCALE),
              'x',
              Math.round(maxHeight * SCALE)
            );

            const payloadJson = JSON.stringify({
              embeds: [
                {
                  image: { url: 'attachment://collage.png' }
                }
              ]
            });

            const boundary = '----WebKitFormBoundary7MA4YWxkTrZu0gW';
            const preamble =
              `--${boundary}\r\n` +
              `Content-Disposition: form-data; name="payload_json"\r\n` +
              `Content-Type: application/json\r\n\r\n` +
              payloadJson + `\r\n` +
              `--${boundary}\r\n` +
              `Content-Disposition: form-data; name="file"; filename="collage.png"\r\n` +
              `Content-Type: image/png\r\n\r\n`;
            const closing = `\r\n--${boundary}--\r\n`;

            const options = new URL(webhook);
            options.method = 'POST';
            options.headers = {
              'Content-Type': 'multipart/form-data; boundary=' + boundary,
            };

            await new Promise((resolve, reject) => {
              const req = https.request(options, res => {
                let respData = '';
                res.on('data', chunk => respData += chunk);
                res.on('end', () => {
                  console.log('Discord response:', res.statusCode, respData);
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error('Discord returned non-2xx status'));
                  } else {
                    resolve();
                  }
                });
              });

              req.on('error', err => {
                console.error('Error sending to Discord:', err);
                reject(err);
              });

              req.write(preamble);
              req.write(collageBuffer);
              req.write(closing);
              req.end();
            });
          }

          (async () => {
            try {
              const comparePath = `/repos/${owner}/${repo}/compare/${baseSha}...${headSha}`;
              console.log('Calling GitHub compare API:', comparePath);
              const compare = await ghRequest(comparePath);
              const files = compare.files || [];
              console.log('Compare returned', files.length, 'file(s)');

              // Only look at JSON model files under assets/.../models/
              const modelFiles = files.filter(
                f =>
                  typeof f.filename === 'string' &&
                  f.filename.toLowerCase().endsWith('.json') &&
                  f.filename.includes('src/main/resources/assets/') &&
                  f.filename.includes('/models/')
              );

              if (!modelFiles.length) {
                console.log('No model JSON files changed in this push, skipping Discord call.');
                process.exit(0);
              }

              console.log(
                'Model JSON files:',
                modelFiles.map(f => f.filename).join(', ')
              );

              fs.mkdirSync('renders', { recursive: true });

              const renderedPaths = [];
              for (const f of modelFiles) {
                const srcPath = path.join(process.cwd(), f.filename);
                if (!fs.existsSync(srcPath)) {
                  console.log('Model file not present in checkout (maybe deleted):', srcPath);
                  continue;
                }
                const baseName = path.basename(f.filename, '.json');
                const outPath = path.join('renders', `${baseName}.png`);
                console.log('Rendering model', srcPath, '->', outPath);
                const ok = await renderModelFile(srcPath, outPath);
                if (ok) {
                  renderedPaths.push(outPath);
                }
              }

              if (!renderedPaths.length) {
                console.log('No model renders produced, skipping Discord call.');
                process.exit(0);
              }

              // Optional safety limit (e.g. first 10 renders)
              const selected = renderedPaths.slice(0, 10);
              console.log('Sending collage of', selected.length, 'render(s)');
              await sendCollageToDiscord(selected);
              process.exit(0);
            } catch (err) {
              console.error('Error in workflow:', err);
              process.exit(1);
            }
          })();
          EOF
